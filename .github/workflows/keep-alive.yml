# Mantener despierto el servicio en horario hábil (RNF-02, RNF-07).
#
# Un solo curl a /health mata dos pájaros: evita que Render suspenda el servicio
# web por inactividad y, como /health ejecuta un SELECT 1, evita también que
# Supabase pause el proyecto.
#
# Fuera de este horario el servicio se suspende a propósito. Mantenerlo despierto
# de madrugada gastaría las horas gratuitas de Render sin que nadie lo use, y el
# arranque en frío ya está cubierto por la interfaz ("Despertando el servidor...").
name: Mantener despierto

on:
  schedule:
    # Cada 10 minutos entre las 6:00 y las 23:59 de Colombia.
    # Colombia es UTC-5 todo el año, sin horario de verano: 6:00 allá son las
    # 11:00 UTC, y las 23:00 son las 4:00 UTC del día siguiente.
    - cron: '*/10 0-4,11-23 * * *'
  workflow_dispatch:

concurrency:
  group: mantener-despierto
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # Sin --fail: que un ping se pierda no es un fallo que merezca un correo de
      # GitHub. El siguiente llega en diez minutos.
      - name: Consultar /health
        run: curl -s -o /dev/null --max-time 120 --retry 2 "${{ secrets.API_URL }}/health"
