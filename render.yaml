# Render Blueprint para el backend de KAIROS (plan gratuito).
# Ver docs/deployment-checklist.md para el procedimiento completo.
services:
  - type: web
    name: kairos-api
    runtime: python
    plan: free
    # Virginia, no Oregón: la base vive en us-east-1 (Norte de Virginia). Con la
    # API en Oregón cada consulta cruzaba el hemisferio y costaba ~350 ms; en la
    # misma región cuesta ~2 ms. Render no permite cambiar la región de un
    # servicio existente, así que cambiar esto exige recrear el servicio.
    region: virginia
    rootDir: backend
    buildCommand: "pip install uv && uv sync --no-dev"
    # Aplica migraciones en el arranque del despliegue y luego levanta la API.
    startCommand: "uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false        # agrupador de Supabase en el puerto 6543
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL_MINUTES
        value: "15"
      - key: JWT_REFRESH_TTL_DAYS
        value: "7"
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "Semillero ML <notificaciones@send.kairospartners.uk>"
      - key: FRONTEND_URL
        value: "https://app.kairospartners.uk"
      - key: JOB_TOKEN
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://app.kairospartners.uk"
      - key: ENVIRONMENT
        value: "production"
